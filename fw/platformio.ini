; Teensy 4.1 build: the portable core (core/, a local library) and the Teensy layer (teensy/).
; The host build and tests are CMakeLists.txt. Build with `pio run`, flash with `pio run -t upload`.
[platformio]
src_dir = teensy
include_dir = teensy
test_dir = teensy/test
default_envs = teensy41

[env:teensy41]
platform = platformio/teensy@6.0.0
board = teensy41
framework = arduino
lib_deps =
    symlink://core
    ssilverman/QNEthernet@0.37.0      ; Ethernet (§8C.3.3): non-blocking DHCP and static IP, AGPL-3.0
build_unflags = -std=gnu++14 -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra
